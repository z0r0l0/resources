name: repo-guard

# 公开仓库的守卫。检查逻辑只有一份实现，位于 scripts/system/repo-guard.sh，
# 本地与 CI 调用同一个脚本 —— 避免两处规则漂移。
#
# 本地等效命令:
#   bash scripts/system/repo-guard.sh
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: 入库守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 运行仓库守卫（与本地同一实现）
        run: bash scripts/system/repo-guard.sh
